name: openreserve
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD}
      CHAIN_DB_PASSWORD: ${CHAIN_DB_PASSWORD:?Set CHAIN_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  catalog-evidence:
    build:
      context: .
      dockerfile: services/catalog-evidence/Dockerfile
    environment:
      DATABASE_URL: postgresql://catalog_user:${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD}@postgres:5432/catalog_db
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CATALOG_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  chain-indexer:
    build:
      context: .
      dockerfile: services/chain-indexer/Dockerfile
    environment:
      DATABASE_URL: postgresql://chain_user:${CHAIN_DB_PASSWORD:?Set CHAIN_DB_PASSWORD}@postgres:5432/chain_db
      RPC_URL: ${FUJI_RPC_URL:-}
      CHAIN_ID: '43113'
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CHAIN_PORT:-3002}:3002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  economics:
    build:
      context: .
      dockerfile: services/economics/Dockerfile
    ports:
      - "127.0.0.1:${ECONOMICS_PORT:-3003}:3003"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  web:
    image: node:24.22.1-bookworm-slim
    working_dir: /app
    environment:
      OPENRESERVE_CATALOG_ORIGIN: http://catalog-evidence:3001
      OPENRESERVE_CHAIN_ORIGIN: http://chain-indexer:3002
      OPENRESERVE_ECONOMICS_ORIGIN: http://economics:3003
      # Browser-side Fuji verification remains opt-in; never inject RPC credentials.
      VITE_VAULT_CHAIN_ID: ${VITE_VAULT_CHAIN_ID:-}
      VITE_VAULT_ADDRESS: ${VITE_VAULT_ADDRESS:-}
      VITE_VAULT_DEPLOYMENT_BLOCK: ${VITE_VAULT_DEPLOYMENT_BLOCK:-}
      VITE_MERCHANT_ADDRESS: ${VITE_MERCHANT_ADDRESS:-}
    depends_on:
      catalog-evidence:
        condition: service_started
      chain-indexer:
        condition: service_started
      economics:
        condition: service_started
    volumes:
      - .:/app
      - web_dependencies:/app/node_modules
    command: ["sh", "-c", "npm ci && npm run prebuild && npm run build --workspace @openreserve/web && npm run preview --workspace @openreserve/web -- --host 0.0.0.0 --port 4173 --strictPort"]
    ports:
      - "127.0.0.1:${WEB_PORT:-4173}:4173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/customer').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    restart: unless-stopped
volumes:
  web_dependencies:
  postgres_data:
