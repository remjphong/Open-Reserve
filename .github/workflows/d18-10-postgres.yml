name: D18-10 Isolated PostgreSQL
on:
  pull_request:
    branches: [unihack-final]
    paths:
      - 'services/chain-indexer/**'
      - '.github/workflows/d18-10-postgres.yml'
permissions:
  contents: read
jobs:
  pg-durable-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral-admin-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - name: Provision disposable databases and verify restricted ownership
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import pg from 'pg'
          const admin = new pg.Client({connectionString:'postgresql://postgres:ephemeral-admin-ci-only@127.0.0.1:5432/postgres'})
          await admin.connect()
          try {
            for (const [role, password] of [['chain_user','ephemeral-chain-ci-only'], ['catalog_user','ephemeral-catalog-ci-only']]) {
              await admin.query(`CREATE ROLE ${role} LOGIN PASSWORD '${password}' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION`)
            }
            await admin.query('CREATE DATABASE chain_db OWNER chain_user')
            await admin.query('CREATE DATABASE catalog_db OWNER catalog_user')
            await admin.query('REVOKE ALL ON DATABASE chain_db FROM PUBLIC')
            await admin.query('REVOKE ALL ON DATABASE catalog_db FROM PUBLIC')
          } finally { await admin.end() }
          const allowed = new pg.Client({connectionString:'postgresql://chain_user:ephemeral-chain-ci-only@127.0.0.1:5432/chain_db'})
          await allowed.connect()
          try {
            const r = await allowed.query("SELECT current_database() AS db, current_user AS role, rolsuper FROM pg_roles WHERE rolname = current_user")
            assert.equal(r.rows[0].db, 'chain_db')
            assert.equal(r.rows[0].role, 'chain_user')
            assert.equal(r.rows[0].rolsuper, false)
          } finally { await allowed.end() }
          const denied = new pg.Client({connectionString:'postgresql://chain_user:ephemeral-chain-ci-only@127.0.0.1:5432/catalog_db'})
          try { await assert.rejects(denied.connect(), /permission denied for database/) }
          finally { await denied.end().catch(() => {}) }
          console.log('PASS restricted chain_user + cross-db CONNECT denied')
          NODE
      - name: Build indexer and API DTOs
        run: |
          npm run build --workspace @openreserve/api-contracts
          npm run build --workspace @openreserve/chain-indexer
      - name: Verify persistent checkpoint, replay, restart and dedupe
        env:
          D18_10_TEST_DATABASE_URL: postgresql://chain_user:ephemeral-chain-ci-only@127.0.0.1:5432/chain_db
          D18_10_ALLOW_TEST_DB_WRITES: '1'
        run: node --test services/chain-indexer/test/store.integration.test.mjs

  fuji-readonly-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - name: Build read-only indexer RPC client
        run: |
          npm run build --workspace @openreserve/api-contracts
          npm run build --workspace @openreserve/chain-indexer
      - name: Verify live Fuji deployment and Agreement 1 ledger read-only
        env:
          RPC_URL: https://api.avax-test.network/ext/bc/C/rpc
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { FujiRpc } from './services/chain-indexer/dist/domain/rpc-client.js'
          import { FUJI } from './services/chain-indexer/dist/domain/protocol.js'
          const rpc = new FujiRpc(process.env.RPC_URL)
          await rpc.assertIdentity()
          const agreement = await rpc.financial('1')
          const tip = await rpc.tip()
          assert.equal(agreement.agreementId, '1')
          assert.ok(BigInt(agreement.deposited) > 0n)
          assert.equal(BigInt(agreement.remainingLocked),
            BigInt(agreement.deposited) - BigInt(agreement.gymWithdrawn) - BigInt(agreement.buyerRefunded))
          console.log('FUJI_READONLY_DEPLOYMENT=PASS')
          console.log('FUJI_AGREEMENT_1_ATOMIC_VIEW=PASS')
          console.log('CHAIN_ID=' + FUJI.chainId)
          console.log('VAULT=' + FUJI.vault)
          console.log('CHAIN_TIP=' + tip.toString())
          console.log('LEDGER=' + JSON.stringify({
            deposited: agreement.deposited, earnedFinalized: agreement.earnedFinalized,
            gymWithdrawn: agreement.gymWithdrawn, buyerRefunded: agreement.buyerRefunded,
            remainingLocked: agreement.remainingLocked, withdrawable: agreement.withdrawable,
            refundable: agreement.refundable, unallocated: agreement.unallocated,
          }))
          console.log('FUJI_SIGNING=NONE')
          NODE

  fuji-indexer-end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral-admin-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - name: Create dedicated disposable chain_db with non-superuser chain_user
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg'
          const admin = new pg.Client({connectionString:'postgresql://postgres:ephemeral-admin-ci-only@127.0.0.1:5432/postgres'})
          await admin.connect()
          try {
            await admin.query("CREATE ROLE chain_user LOGIN PASSWORD 'ephemeral-chain-ci-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION")
            await admin.query('CREATE DATABASE chain_db OWNER chain_user')
            await admin.query('REVOKE ALL ON DATABASE chain_db FROM PUBLIC')
          } finally { await admin.end() }
          console.log('DISPOSABLE_CHAIN_DB_READY=PASS')
          NODE
      - name: Build indexer runtime
        run: |
          npm run build --workspace @openreserve/api-contracts
          npm run build --workspace @openreserve/chain-indexer
      - name: Bounded live event ingestion, receipt and durable checkpoint (not full sync)
        timeout-minutes: 12
        env:
          DATABASE_URL: postgresql://chain_user:ephemeral-chain-ci-only@127.0.0.1:5432/chain_db
          RPC_URL: https://api.avax-test.network/ext/bc/C/rpc
          CHAIN_ID: '43113'
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import pg from 'pg'
          import { setTimeout as delay } from 'node:timers/promises'
          import { FujiRpc } from './services/chain-indexer/dist/domain/rpc-client.js'
          import { PgStore } from './services/chain-indexer/dist/domain/store.js'
          import { Indexer } from './services/chain-indexer/dist/domain/indexer.js'
          import { FUJI } from './services/chain-indexer/dist/domain/protocol.js'
          const reader = new FujiRpc(process.env.RPC_URL)
          const store = new PgStore(process.env.DATABASE_URL)
          const client = new pg.Client({connectionString:process.env.DATABASE_URL})
          const cutoff = Date.now()+8*60_000
          const maxTicks=35
          let lastWindow=null, attempts=0, failures=0, firstCheckpoint=null, event=null
          const originalLogs=reader.logs.bind(reader)
          reader.logs=async(from,to)=>{
            const start=Date.now()
            lastWindow={from,to}
            try {
              const result=await originalLogs(from,to)
              if (++attempts<=2||attempts%10===0) console.log('GETLOGS_WINDOW='+JSON.stringify({
                from:from.toString(),to:to.toString(),count:result.length,ms:Date.now()-start,status:'OK'}))
              return result
            } catch(e) {
              const message=e instanceof Error?e.message:'UNKNOWN'
              console.log('GETLOGS_WINDOW='+JSON.stringify({from:from.toString(),to:to.toString(),
                ms:Date.now()-start,status:'FAILED',code:/^[A-Z][A-Z0-9_]{3,70}$/.test(message)?message:'SANITIZED_UNKNOWN'}))
              throw e
            }
          }
          async function rpc(method,params) {
            const r=await fetch(process.env.RPC_URL,{method:'POST',headers:{'content-type':'application/json'},
              body:JSON.stringify({jsonrpc:'2.0',id:1,method,params}),signal:AbortSignal.timeout(15000)})
            if(!r.ok)throw Error('FUJI_RPC_HTTP_'+r.status)
            const j=await r.json()
            if(j.jsonrpc!=='2.0'||j.id!==1||j.error||!Object.hasOwn(j,'result'))throw Error('FUJI_RPC_ENVELOPE_INVALID')
            return j.result
          }
          async function diagnostic() {
            if(!lastWindow)return console.log('RPC_DIAGNOSTIC=NO_GETLOGS_FAILURE_PROVEN')
            try {
              const r=await fetch(process.env.RPC_URL,{method:'POST',headers:{'content-type':'application/json'},
                body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_getLogs',params:[{
                  address:FUJI.vault,fromBlock:'0x'+lastWindow.from.toString(16),toBlock:'0x'+lastWindow.to.toString(16)}]}),
                signal:AbortSignal.timeout(15000)})
              const j=await r.json()
              const msg=typeof j.error?.message==='string'?j.error.message:''
              const category=/rate|too many/i.test(msg)?'RATE_LIMIT':/range|block|limit/i.test(msg)?'RANGE_LIMIT':
                /timeout/i.test(msg)?'TIMEOUT':j.error?'PROVIDER_ERROR':'NO_ERROR_ON_RETRY'
              console.log('RPC_DIAGNOSTIC='+JSON.stringify({from:lastWindow.from.toString(),to:lastWindow.to.toString(),
                httpStatus:r.status,code:Number.isInteger(j.error?.code)?j.error.code:null,category}))
            }catch{console.log('RPC_DIAGNOSTIC=UNAVAILABLE_OR_TIMEOUT')}
          }
          const indexer=new Indexer(reader,store,8,1000)
          try {
            await store.initialize()
            await client.connect()
            assert.equal(await store.checkpoint(),null,'MUST_START_AT_DEPLOYMENT_WITH_EMPTY_DISPOSABLE_DB')
            for(let tick=0;tick<maxTicks&&Date.now()<cutoff;tick++){
              await indexer.tick()
              const cp=await store.checkpoint()
              const sync=indexer.getSync().payload
              if(cp&&!firstCheckpoint){
                assert.ok(cp.height>=FUJI.deploymentBlock&&cp.height<=FUJI.deploymentBlock+799n)
                assert.equal((cp.height-FUJI.deploymentBlock+1n)%100n,0n,'NO_SKIPPED_INITIAL_BLOCKS')
                firstCheckpoint=cp
                console.log('DEPLOYMENT_FROM_BLOCK='+FUJI.deploymentBlock+' FIRST_CHECKPOINT='+cp.height)
              }
              if(sync.lastError&&sync.lastError!=='SYNC_CATCHING_UP'){
                failures++
                console.log('DEGRADED='+sync.lastError+' CHECKPOINT='+(cp?.height.toString()??'null'))
                assert.equal(indexer.getSync().code,503,'RPC_FAILURE_FAIL_CLOSED')
                await diagnostic()
                if(failures>=3)throw Error('RPC_REPEATED_FAILURE')
                await delay(1000)
                continue
              }
              failures=0
              const q=await client.query('SELECT agreement_id,tx_hash,log_index,block_number::text AS block_number,block_hash,transaction_index,topics,data,event_name FROM chain_events WHERE chain_id=$1 AND contract_address=$2 ORDER BY block_number,transaction_index,log_index LIMIT 1',[FUJI.chainId,FUJI.vault.toLowerCase()])
              if(q.rows.length){event=q.rows[0];break}
              if(tick%3===0)console.log('PROGRESS='+JSON.stringify({checkpoint:cp?.height.toString()??null,tip:sync.chainTip,stale:sync.isStale,error:sync.lastError}))
            }
            const cp=await store.checkpoint()
            if(!event)throw Error('NO_REAL_VAULT_EVENT_WITHIN_BOUNDED_WINDOW')
            assert.ok(cp&&cp.height>=BigInt(event.block_number))
            const receipt=await rpc('eth_getTransactionReceipt',[event.tx_hash])
            assert.ok(receipt&&receipt.blockHash?.toLowerCase()===event.block_hash.toLowerCase(),'RECEIPT_BLOCK_HASH')
            assert.ok(receipt.logs?.some(l=>l.address?.toLowerCase()===FUJI.vault.toLowerCase()&&
              l.transactionHash?.toLowerCase()===event.tx_hash.toLowerCase()&&
              BigInt(l.logIndex)===BigInt(event.log_index)&&
              l.blockHash?.toLowerCase()===event.block_hash.toLowerCase()&&
              l.data?.toLowerCase()===event.data.toLowerCase()&&
              Array.isArray(l.topics)&&l.topics.length===event.topics.length&&
              l.topics.every((topic,i)=>topic.toLowerCase()===event.topics[i].toLowerCase())
            ),'PERSISTED_EVENT_MUST_MATCH_REAL_RECEIPT')
            assert.equal((await reader.block(BigInt(event.block_number))).hash,event.block_hash.toLowerCase())
            const before=await client.query('SELECT COUNT(*)::int AS n FROM chain_events WHERE chain_id=$1 AND contract_address=$2',[FUJI.chainId,FUJI.vault.toLowerCase()])
            const from=cp.height-11n>=FUJI.deploymentBlock?cp.height-11n:FUJI.deploymentBlock
            await store.applyWindow(from,cp.height,cp.hash,await reader.logs(from,cp.height))
            const after=await client.query('SELECT COUNT(*)::int AS n FROM chain_events WHERE chain_id=$1 AND contract_address=$2',[FUJI.chainId,FUJI.vault.toLowerCase()])
            assert.equal(after.rows[0].n,before.rows[0].n,'LIVE_REPLAY_MUST_NOT_DUPLICATE')
            await store.close()
            const reopened=new PgStore(process.env.DATABASE_URL)
            try {
              await reopened.initialize()
              assert.equal((await reopened.checkpoint()).height,cp.height)
              assert.ok((await reopened.events(event.agreement_id,0,100)).items.some(e=>
                e.txHash===event.tx_hash&&e.logIndex===event.log_index))
            }finally{await reopened.close()}
            const inaccessible=new Indexer(new FujiRpc('http://127.0.0.1:1'),{
              initialize:async()=>{},checkpoint:async()=>cp,applyWindow:async()=>{throw Error('UNEXPECTED_DB_WRITE')},
              projection:async()=>null,events:async()=>({items:[],hasNext:false}),close:async()=>{}
            },1,1000)
            await inaccessible.tick()
            assert.equal(inaccessible.getSync().code,503)
            assert.equal(inaccessible.getSync().payload.isStale,true)
            console.log('BOUNDED_LIVE_EVENT_PROOF=PASS')
            console.log('DURABLE_EVENT_REPLAY_RESTART=PASS')
            console.log('RPC_UNAVAILABLE_FAIL_CLOSED=PASS')
            console.log('SOURCE_EVENT='+JSON.stringify({agreementId:event.agreement_id,txHash:event.tx_hash,
              block:event.block_number,logIndex:event.log_index,eventName:event.event_name,
              lastIndexedBlock:cp.height.toString()}))
            console.log('FULL_FUJI_SYNC=NOT_VERIFIED')
            console.log('FUJI_SIGNING=NONE')
          }catch(e){
            console.log('BOUNDED_LIVE_EVENT_PROOF=HOLD')
            const msg=e instanceof Error?e.message:'UNKNOWN'
            console.log('REASON='+(/^[A-Z][A-Z0-9_]{3,80}$/.test(msg)?msg:'SANITIZED_VALIDATION_FAILURE'))
            console.log('FULL_FUJI_SYNC=NOT_VERIFIED')
            process.exitCode=1
          }finally{
            await client.end().catch(()=>{})
            await store.close().catch(()=>{})
          }
          NODE

