name: D18-10 Isolated PostgreSQL
on:
  pull_request:
    branches: [unihack-final]
    paths:
      - 'services/chain-indexer/**'
      - '.github/workflows/d18-10-postgres.yml'
permissions:
  contents: read
jobs:
  pg-durable-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral-admin-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - name: Provision disposable databases and verify restricted ownership
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import pg from 'pg'
          const admin = new pg.Client({connectionString:'postgresql://postgres:ephemeral-admin-ci-only@127.0.0.1:5432/postgres'})
          await admin.connect()
          try {
            for (const [role, password] of [['chain_user','ephemeral-chain-ci-only'], ['catalog_user','ephemeral-catalog-ci-only']]) {
              await admin.query(`CREATE ROLE ${role} LOGIN PASSWORD '${password}' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION`)
            }
            await admin.query('CREATE DATABASE chain_db OWNER chain_user')
            await admin.query('CREATE DATABASE catalog_db OWNER catalog_user')
            await admin.query('REVOKE ALL ON DATABASE chain_db FROM PUBLIC')
            await admin.query('REVOKE ALL ON DATABASE catalog_db FROM PUBLIC')
          } finally { await admin.end() }
          const allowed = new pg.Client({connectionString:'postgresql://chain_user:ephemeral-chain-ci-only@127.0.0.1:5432/chain_db'})
          await allowed.connect()
          try {
            const r = await allowed.query("SELECT current_database() AS db, current_user AS role, rolsuper FROM pg_roles WHERE rolname = current_user")
            assert.equal(r.rows[0].db, 'chain_db')
            assert.equal(r.rows[0].role, 'chain_user')
            assert.equal(r.rows[0].rolsuper, false)
          } finally { await allowed.end() }
          const denied = new pg.Client({connectionString:'postgresql://chain_user:ephemeral-chain-ci-only@127.0.0.1:5432/catalog_db'})
          try { await assert.rejects(denied.connect(), /permission denied for database/) }
          finally { await denied.end().catch(() => {}) }
          console.log('PASS restricted chain_user + cross-db CONNECT denied')
          NODE
      - name: Build indexer and API DTOs
        run: |
          npm run build --workspace @openreserve/api-contracts
          npm run build --workspace @openreserve/chain-indexer
      - name: Verify persistent checkpoint, replay, restart and dedupe
        env:
          D18_10_TEST_DATABASE_URL: postgresql://chain_user:ephemeral-chain-ci-only@127.0.0.1:5432/chain_db
          D18_10_ALLOW_TEST_DB_WRITES: '1'
        run: node --test services/chain-indexer/test/store.integration.test.mjs

  fuji-readonly-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - name: Build read-only indexer RPC client
        run: |
          npm run build --workspace @openreserve/api-contracts
          npm run build --workspace @openreserve/chain-indexer
      - name: Verify live Fuji deployment and Agreement 1 ledger read-only
        env:
          RPC_URL: https://api.avax-test.network/ext/bc/C/rpc
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { FujiRpc } from './services/chain-indexer/dist/domain/rpc-client.js'
          import { FUJI } from './services/chain-indexer/dist/domain/protocol.js'
          const rpc = new FujiRpc(process.env.RPC_URL)
          await rpc.assertIdentity()
          const agreement = await rpc.financial('1')
          const tip = await rpc.tip()
          assert.equal(agreement.agreementId, '1')
          assert.ok(BigInt(agreement.deposited) > 0n)
          assert.equal(BigInt(agreement.remainingLocked),
            BigInt(agreement.deposited) - BigInt(agreement.gymWithdrawn) - BigInt(agreement.buyerRefunded))
          console.log('FUJI_READONLY_DEPLOYMENT=PASS')
          console.log('FUJI_AGREEMENT_1_ATOMIC_VIEW=PASS')
          console.log('CHAIN_ID=' + FUJI.chainId)
          console.log('VAULT=' + FUJI.vault)
          console.log('CHAIN_TIP=' + tip.toString())
          console.log('LEDGER=' + JSON.stringify({
            deposited: agreement.deposited, earnedFinalized: agreement.earnedFinalized,
            gymWithdrawn: agreement.gymWithdrawn, buyerRefunded: agreement.buyerRefunded,
            remainingLocked: agreement.remainingLocked, withdrawable: agreement.withdrawable,
            refundable: agreement.refundable, unallocated: agreement.unallocated,
          }))
          console.log('FUJI_SIGNING=NONE')
          NODE

  fuji-indexer-end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral-admin-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - name: Create dedicated disposable chain_db with non-superuser chain_user
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg'
          const admin = new pg.Client({connectionString:'postgresql://postgres:ephemeral-admin-ci-only@127.0.0.1:5432/postgres'})
          await admin.connect()
          try {
            await admin.query("CREATE ROLE chain_user LOGIN PASSWORD 'ephemeral-chain-ci-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION")
            await admin.query('CREATE DATABASE chain_db OWNER chain_user')
            await admin.query('REVOKE ALL ON DATABASE chain_db FROM PUBLIC')
          } finally { await admin.end() }
          console.log('DISPOSABLE_CHAIN_DB_READY=PASS')
          NODE
      - name: Build indexer runtime
        run: |
          npm run build --workspace @openreserve/api-contracts
          npm run build --workspace @openreserve/chain-indexer
      - name: Bounded live Fuji sync to deploy block, then independent receipt/ledger smoke
        timeout-minutes: 16
        env:
          DATABASE_URL: postgresql://chain_user:ephemeral-chain-ci-only@127.0.0.1:5432/chain_db
          RPC_URL: https://api.avax-test.network/ext/bc/C/rpc
          FUJI_RPC_URL: https://api.avax-test.network/ext/bc/C/rpc
          CHAIN_ID: '43113'
          HOST: 127.0.0.1
          PORT: '3002'
          INDEXER_WINDOWS_PER_POLL: '100'
          INDEXER_POLL_MS: '1000'
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { spawn } from 'node:child_process'
          import { setTimeout as sleep } from 'node:timers/promises'
          const child = spawn(process.execPath, ['services/chain-indexer/dist/server.js'], {
            env: process.env, stdio: ['ignore','ignore','pipe'],
          })
          let exit = null
          let lastStderr = ''
          child.on('exit', (code, signal) => { exit = { code, signal } })
          child.stderr.on('data', d => { lastStderr = (lastStderr + String(d)).slice(-1000) })
          let lastReported = -1n
          let lastSync = null
          try {
            const deadline = Date.now() + 12 * 60_000
            while (Date.now() < deadline) {
              if (exit) throw new Error('INDEXER_EXITED_EARLY')
              await sleep(8000)
              let response
              try { response = await fetch('http://127.0.0.1:3002/v1/sync', { signal: AbortSignal.timeout(9000) }) }
              catch { continue }
              const sync = await response.json()
              lastSync = sync
              if (sync.lastIndexedBlock !== null && /^\d+$/.test(sync.lastIndexedBlock)) {
                const height = BigInt(sync.lastIndexedBlock)
                if (lastReported < 0n || height - lastReported >= 10000n) {
                  console.log('INDEXED_BLOCK=' + height.toString() + ' TIP=' + sync.chainTip + ' STALE=' + sync.isStale)
                  lastReported = height
                }
              }
              if (response.status === 200 && !sync.isStale) {
                console.log('FUJI_FULL_SYNC=PASS LAST_INDEXED_BLOCK=' + sync.lastIndexedBlock)
                const { spawnSync } = await import('node:child_process')
                const smoke = spawnSync(process.execPath, ['services/chain-indexer/test/smoke-fuji-readonly.mjs'], {
                  env: process.env, encoding: 'utf8', timeout: 60_000,
                })
                process.stdout.write(smoke.stdout || '')
                process.stderr.write(smoke.stderr || '')
                assert.equal(smoke.status, 0, 'LIVE_FUJI_LEDGER_SMOKE_FAILED')
                console.log('FUJI_INDEXER_E2E=PASS')
                break
              }
            }
            if (lastSync?.isStale !== false) {
              console.log('LAST_SYNC=' + JSON.stringify(lastSync))
              throw new Error('FUJI_FULL_SYNC_NOT_REACHED_WITHIN_BUDGET')
            }
          } finally {
            child.kill('SIGTERM')
            await sleep(500)
          }
          NODE
